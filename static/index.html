<title>Northstar Homes — Sales Assistant</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --ink:#1a1d24;
          --brand:#0a4d8c; --agent:#eef2f7; --me:#0a4d8c; --muted:#6b7280; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --agent:#242832; --muted:#9aa0aa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; justify-content:center; }
  .app { width:100%; max-width:620px; height:100dvh; display:flex; flex-direction:column;
         background:var(--card); }
  header { padding:14px 18px; border-bottom:1px solid #8883; }
  header b { color:var(--brand); }
  header small { color:var(--muted); display:block; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; }
  .agent { background:var(--agent); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .sys { align-self:center; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #8883; }
  input { flex:1; padding:10px 12px; border:1px solid #8886; border-radius:10px;
          background:transparent; color:inherit; font-size:15px; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--brand);
           color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button:disabled { opacity:.5; cursor:default; }
  pre { background:var(--agent); padding:12px; border-radius:10px; overflow-x:auto;
        margin:0 16px 12px; font-size:13px; }
</style>

<div class="app">
  <header>
    <b>Northstar Homes</b> · Project Northstar One
    <small>Ask in English, हिंदी, or Hinglish · try “Hi, tell me about the project”</small>
  </header>
  <div id="log"></div>
  <pre id="analytics" hidden></pre>
  <form id="f">
    <input id="m" autocomplete="off" placeholder="Type your message…" autofocus>
    <button id="send">Send</button>
    <button id="endbtn" type="button" class="ghost">End &amp; analyze</button>
  </form>
</div>

<script>
const sid = crypto.randomUUID();
const log = document.getElementById('log');
const input = document.getElementById('m');

function bubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  bubble(text, 'me');
  const thinking = bubble('…', 'agent');
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sid, message: text})
    });
    const data = await r.json();
    thinking.textContent = data.reply || '(no reply)';
    if (data.booked) bubble('✓ Site visit booked', 'sys');
  } catch (err) {
    thinking.textContent = '⚠ ' + err;
  }
});

document.getElementById('endbtn').addEventListener('click', async () => {
  bubble('— conversation ended —', 'sys');
  const box = document.getElementById('analytics');
  box.hidden = false;
  box.textContent = 'Analyzing…';
  const r = await fetch('/end', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sid})
  });
  box.textContent = JSON.stringify(await r.json(), null, 2);
});
</script>
